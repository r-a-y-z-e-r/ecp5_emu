name: Documentation site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook v0.5.4
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl --fail --location --retry 3 https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/mdbook.tar.gz"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - run: python3 site/build.py
      - name: Include theme asset notices
        run: python3 packaging/site_notices.py site/book
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site/book/
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: documentation-site
          path: site/book
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/book
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
