# An 8-bit counter on the 25 MHz clock, no PLL, on the LEDs.
# Build: ecp5_emu build examples/ulx3s/blinky_cycle (outputs in build/); run in the
# window: ecp5_emu run examples/ulx3s/blinky_cycle; load into the board's SRAM:
# ecp5_emu load examples/ulx3s/blinky_cycle.

[project]
name = "blinky_cycle"
top = "top"

[sources]
verilog = ["top.v"]
constraints = "top.lpf"
