# Eight 640x480 DVI colour bars on the GPDI connector.
# Build: ecp5_emu build examples/ulx3s/hdmi_bars (outputs in build/); run in the
# window: ecp5_emu run examples/ulx3s/hdmi_bars; load into the board's SRAM:
# ecp5_emu load examples/ulx3s/hdmi_bars.

[project]
name = "hdmi_bars"
top = "top"

[sources]
verilog = ["pll.v", "tmds.v", "top.v", "video_out.v"]
constraints = "top.lpf"
