# Input-only J1/J2 header probes, with internal PWM counts on the UART.
# Build: ecp5_emu build examples/ulx3s/header_probe (outputs in build/); run in the
# window: ecp5_emu run examples/ulx3s/header_probe; load into the board's SRAM:
# ecp5_emu load examples/ulx3s/header_probe.

[project]
name = "header_probe"
top = "top"

[sources]
verilog = ["header_logic.v", "top.v", "uart_tx.v"]
constraints = "top.lpf"
