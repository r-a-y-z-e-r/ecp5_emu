[package]
name = "ecp5_emu"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Headless, bitstream-driven ECP5 emulator"

[features]
# Per-call profiling in the ignored compile timing test harness.
compile-timing = []

[dependencies]
anyhow = "1.0"
postcard = { version = "1", default-features = false, features = ["use-std"] }
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "1.1"
toml_edit = "0.25.19"

# The GUI (gui/) is a separate member, so building and testing the emulator
# does not build eframe.
[workspace]
members = ["gui"]
default-members = ["."]
